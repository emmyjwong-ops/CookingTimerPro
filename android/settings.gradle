pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'CookingTimerPro'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// react-native-google-mobile-ads is not picked up by autolinkLibrariesFromCommand()
// because its CMakeLists.txt (codegen output) doesn't exist until after first build.
// Include it manually so the library is compiled and the package can be registered.
include ':react-native-google-mobile-ads'
project(':react-native-google-mobile-ads').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-google-mobile-ads/android')
